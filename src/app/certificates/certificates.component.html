<h3>Certificates</h3>

<ul>
    <li *ngFor="let certificate of certificates">
        {{certificate.name}} <br>
        {{certificate.institution}} <br>
        {{certificate.date}} <br>
        <a *ngIf="certificate.url" [href]="certificate.url" target="_blank" rel="noopener noreferrer">View certificate</a>
    </li>
</ul>
